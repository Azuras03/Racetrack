<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="assets/icon.ico">

    <script defer type="module" src="./src/creatorScript.js"></script>
    <link rel="stylesheet" href="./src/styles.css">
    <title>Racetrack</title>
</head>

<body>

    <div id="game">
        <canvas id="touchCanvas"></canvas>
        <canvas id="pathCanvas"></canvas>
        <canvas id="gameCanvas"></canvas>
        </div>

    <div id="header">
        <a href="./index">Home</a>
    </div>
    
    <footer>
        <input type="number" id="pencilSize" value="2" min="1" max="100"> 
        <div id="pencil" class="unactive active">Pencil</div>
        <div id="end" class="unactive">EndPencil</div>
        <div id="eraser" class="unactive">Eraser</div>
        <div id="clearButton" class="unactive">Clear</div>
        <div id="spawner" class="unactive">Spawner</div>
        <div id="exportButton">Export!</div>
        <div id="saveButton">Save!</div>
        <input type="number" id="widthSelector" value="20" min="5" max="1000"> 
        <input type="number" id="heightSelector" value="20" min="5" max="1000">
        <input type="number" id="densitySelector" value="2" min="1" max="100">
    </footer>

</body>
